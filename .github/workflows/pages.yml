name: Deploy static GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static snapshot
        uses: actions/checkout@v4

      - name: Pin semantic assets to this snapshot
        env:
          SEMANTIC_VERSION_PLACEHOLDER: "0000000000000000000000000000000000000000"
        run: |
          find site -type f \( -name '*.js' -o -name '*.html' -o -name '*.txt' \) -print0 \
            | xargs -0 sed -i "s/${SEMANTIC_VERSION_PLACEHOLDER}/${GITHUB_SHA}/g"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
